<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- хэширование -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/md5.js"></script>
    <title>Бесплатный кофе</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="row-1">
      <h1>Добро пожаловать!</h1>
      <h3>
        Вам нужно придумать ключевое слово, чтобы мы могли понять, что это вы!
        Оно гарантирует вам вашу чашку кофе!
      </h3>
      <h5>Заполните все поля и запишите уникальный код.</h5>
    </div>

    <div class="gradient-wrap">
      <div class="row-2">
        <input
          type="text"
          id="site_url"
          placeholder="Вставьте адрес сайта, где вам нужен пароль"
        />
        <!--делаем отступ -->
        <br />
        <!-- задаём поле ввода для кодового слова и настраиваем параметры поля -->
        <input
          type="text"
          id="keyword"
          placeholder="Напишите кодовое слово, чтобы сделать пароль сильнее"
        />
        <!--делаем двойной отступ -->
        <br />
        <br />
        <!-- вставляем кнопку, которая запускает генератор пароля и настраиваем отступы -->
        <button onclick="generatePassword()">Создать пароль</button>
        <!--выводим сгенерированный пароль -->
        <p>Ваш пароль:</p>
        <div id="pass_text" style="font-weight: bold"></div>
      </div>
    </div>

    <script>
        function generatePassword() {
    var length = 8,
        charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
        retVal = "";
    for (var i = 0, n = charset.length; i < length; ++i) {
        retVal += charset.charAt(Math.floor(Math.random() * n));
        document.getElementById('pass_text').innerHTML = retVal;
    }
    return retVal;
}

    </script>

    <script>
      // задаём переменные, где будем хранить адрес сайта, кодовое слово… 
      var site, salt; // …исходные текстовые данные для пароля и сам пароль 
      var text, password; // объявляем функцию, которая создаёт пароль и выводит его на экран 
      function generate() { // кладём в соответствующие переменные текстовое значение адреса сайта… 
        site = document.getElementById('site_url').value; // …и кодового слова 
        salt = document.getElementById('keyword').value; // подготавливаем исходную строку для пароля и добавляем в неё наш секретный ингредиент 
        text = site + salt; // на основе этой строки с помощью функции md5, которую мы подключили в самом начале, создаём пароль 
        password = md5(text); // выводим его на экран 
        document.getElementById('pass_text').innerHTML = password; } // закончилась скриптовая часть
    </script>
  </body>
</html>
